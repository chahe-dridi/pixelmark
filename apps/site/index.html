    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "pixelmark",
        "description": "Animated pixel-art wordmarks for React: 19 classic pixel effects and 16 game & story cutscenes.",

        "codeRepository": "https://github.com/chahe-dridi/pixelmark",

      }
    </script>
    <script>
      // pick the saved theme before first paint (no flash)
      try {
        var t = localStorage.getItem('pixelmark-theme')
        if (t === 'light' || (!t && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.classList.replace('dark', 'light')
      } catch (e) {}
    </script>

  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;font-family:sans-serif">pixelmark turns any text into an animated pixel-art wordmark for React. This showcase needs JavaScript; the docs are also on <a href="https://github.com/chahe-dridi/pixelmark">GitHub</a>.</p>

    <script type="module" src="/src/main.jsx"></script>
