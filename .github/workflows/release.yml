name: Release

# Pushing a tag like v0.2.0 (see `npm run release`) publishes that version
# to npm and creates a GitHub release. Needs the NPM_TOKEN repository secret.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run build:lib
      - name: Tag matches package version
        run: test "v$(node -p "require('./packages/pixelmark/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish -w pixelmark --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
